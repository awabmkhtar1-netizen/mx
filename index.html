    const PRICE_OPTIONS = ["الكل", "أقل من 300 ألف", "300 - 500 ألف", "أكثر من 500 ألف"];
    const STATUS_OPTIONS = ["الكل", "متاح", "محجوز", "مباع"];
    const ROOMS_OPTIONS = ["الكل", "2", "3", "4", "5"];

    function statusClass(s) {
      if (s === "متاح") return "bg-emerald-500/95 text-white border-emerald-400";
      if (s === "محجوز") return "bg-amber-500/95 text-white border-amber-400";
      return "bg-zinc-700/90 text-white border-zinc-600";
    }
    function statusSolid(s) {
      if (s === "متاح") return "bg-emerald-500 text-white";
      if (s === "محجوز") return "bg-amber-500 text-white";
      return "bg-zinc-700 text-white";
    }

    /* ============================================================

       ============================================================ */
    const IconUser = function (props) {
      props = props || {};
      return h('svg', {
        xmlns: 'http://www.w3.org/2000/svg',
        width: props.size || 20,
        height: props.size || 20,

        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round'
      }, [
        h('path', { key: 'p1', d: 'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2' }),
        h('circle', { key: 'c', cx: 12, cy: 7, r: 4 })
      ]);
    };

    const IconHeart = function (props) {
      props = props || {};
      const filled = !!props.filled;
      return h('svg', {
        xmlns: 'http://www.w3.org/2000/svg',
        width: props.size || 18,
        height: props.size || 18,
        viewBox: '0 0 24 24',
        fill: filled ? '#e11d48' : 'none',
        stroke: filled ? '#e11d48' : (props.stroke || '#111'),
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round'
      }, h('path', {
        d: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z'
      }));
    };

    const IconHome = function (props) {
      props = props || {};
      return h('svg', {
        xmlns: 'http://www.w3.org/2000/svg',
        width: props.size || 22,
        height: props.size || 22,
        viewBox: '0 0 24 24',
        fill: 'none',
        stroke: props.stroke || '#111',
        strokeWidth: 2,
        strokeLinecap: 'round',
        strokeLinejoin: 'round'
      }, [
        h('path', { key: 'p1', d: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' }),
        h('polyline', { key: 'p2', points: '9 22 9 12 15 12 15 22' })
      ]);
    };

    /* ============================================================
       المكوّن الرئيسي
       ============================================================ */
    function App() {
      const [search, setSearch] = useState("");
      const [status, setStatus] = useState("الكل");
      const [rooms, setRooms] = useState("الكل");
      const [district, setDistrict] = useState("الكل");
      const [price, setPrice] = useState("الكل");
      const [selected, setSelected] = useState(null);
      const [imgIdx, setImgIdx] = useState(0);
      const [loading, setLoading] = useState(true);
const [apartments, setApartments] = useState([]);
      // ✅ حالة المستخدم والمفضلة والواجهة
      const [user, setUser] = useState(null);
      const [favorites, setFavorites] = useState(new Set());
      const [view, setView] = useState("home"); // home | favorites | account
      const [authOpen, setAuthOpen] = useState(false);
      const [authMode, setAuthMode] = useState("login"); // login | register
      const [authForm, setAuthForm] = useState({ name: "", email: "", password: "" });
      const [authError, setAuthError] = useState("");
      const [authLoading, setAuthLoading] = useState(false);

      // تحميل المستخدم الحالي
      useEffect(function () {
        fetch("/api/auth/me", { credentials: "include" })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (u) { setUser(u || null); })
          .catch(function () { setUser(null); });
      }, []);

      // تحميل المفضلة لما المستخدم يتعرف
      useEffect(function () {
        if (!user) { setFavorites(new Set()); return; }
        fetch("/api/favorites", { credentials: "include" })
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (ids) { setFavorites(new Set((ids || []).map(String))); })
          .catch(function () {});
      }, [user]);

useEffect(function () {
  fetch("/api/properties")
    .then(function(res) { return res.json(); })
    .then(function(data) {
       const formatted = data.map(function(p) {
         return Object.assign({}, p, {
           images: p.images ? JSON.parse(p.images) : [],
           elevator: p.elevator === 1,
           parking: p.parking === 1,
           longDesc: p.long_description
         });
       });
       setApartments(formatted);
       setLoading(false);
    })
    .catch(function() { setLoading(false); });
}, []);

      useEffect(function () {
        if (selected) setImgIdx(0);
      }, [selected]);

      async function toggleFavorite(id) {
        if (!user) { setAuthOpen(true); return; }
        const key = String(id);
        const isFav = favorites.has(key);
        setFavorites(function (prev) {
          const next = new Set(prev);
          if (isFav) next.delete(key); else next.add(key);
          return next;
        });
        try {
          const res = await fetch(isFav ? "/api/favorites/remove" : "/api/favorites/add", {
            method: isFav ? "DELETE" : "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ propertyId: key })
          });
          if (!res.ok) throw new Error();
        } catch (e) {
          setFavorites(function (prev) {
            const next = new Set(prev);
            if (isFav) next.add(key); else next.delete(key);
            return next;
          });
        }
      }

      async function submitAuth() {
        setAuthLoading(true);
        setAuthError("");
        try {
          const url = authMode === "login" ? "/api/auth/login" : "/api/auth/register";
          const body = authMode === "login"
            ? { email: authForm.email, password: authForm.password }
            : { name: authForm.name, email: authForm.email, password: authForm.password };
          const res = await fetch(url, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const data = await res.json().catch(function () { return {}; });
          if (!res.ok) throw new Error(data.error || "حدث خطأ، تحقق من البيانات");
          setUser(data.user || data);
          setAuthOpen(false);
          setAuthForm({ name: "", email: "", password: "" });
          setView("account");
        } catch (e) {
          setAuthError(e.message || "حدث خطأ");
        } finally {
          setAuthLoading(false);
        }
      }

      async function logout() {
        try { await fetch("/api/auth/logout", { method: "POST", credentials: "include" }); } catch (e) {}
        setUser(null);
        setFavorites(new Set());
        setView("home");
      }

  const filtered = useMemo(function () {
  return apartments.filter(function (a) {
          if (status !== "الكل" && a.status !== status) return false;
          if (rooms !== "الكل" && String(a.rooms) !== rooms) return false;
          if (district !== "الكل" && a.district !== district) return false;
          if (price !== "الكل") {
            if (price === "أقل من 300 ألف" && a.price >= 300000) return false;
            if (price === "300 - 500 ألف" && (a.price < 300000 || a.price > 500000)) return false;
            if (price === "أكثر من 500 ألف" && a.price <= 500000) return false;
          }
          if (search) {
            const q = search.toLowerCase();
            const hay = (a.title + " " + a.short + " " + a.location + " " + a.district + " " + a.description).toLowerCase();
            return hay.indexOf(q) !== -1;
          }
          return true;
        });
      }, [search, status, rooms, district, price]);

      const favoriteProperties = useMemo(function () {
        return APARTMENTS.filter(function (p) { return favorites.has(String(p.id)); });
      }, [favorites]);

      function resetAll() {
        setSearch("");
        setStatus("الكل");
        setRooms("الكل");
        setDistrict("الكل");
        setPrice("الكل");
      }
const DISTRICTS = Array.from(new Set(apartments.map(function (a) { return a.district; })));
const TOTAL = apartments.length;
      /* ---------- كارت عقار (قابل لإعادة الاستخدام) ---------- */
      function renderPropertyCard(p) {
        const isFav = favorites.has(String(p.id));
        return h("article", { key: p.id, className: "group rounded-[22px] bg-white border border-black/5 overflow-hidden shadow-[0_6px_20px_rgba(0,0,0,0.04)] hover:shadow-[0_18px_40px_rgba(0,0,0,0.10)] hover:-translate-y-[2px] transition-all duration-300" }, [
          h("div", { key: "img", className: "relative aspect-[16/10.5] overflow-hidden bg-[#f5f3f0]" }, [
            h("img", {
              key: "i",
              src: p.images[0],
              alt: p.title,
              loading: "lazy",
              className: "absolute inset-0 w-full h-full object-cover group-hover:scale-[1.03] transition duration-700",
              onError: handleImgError
            }),
            /* ✅ أيقونة المفضلة — فوق شمال الكارت */
            h("button", {
              key: "fav",
              onClick: function (e) { e.stopPropagation(); toggleFavorite(p.id); },
              "aria-label": isFav ? "إزالة من المفضلة" : "إضافة للمفضلة",
              className: "absolute top-3 left-3 z-10 h-9 w-9 grid place-items-center rounded-full bg-white/90 backdrop-blur border border-black/5 shadow-sm hover:opacity-90 transition"
            }, h(IconHeart, { filled: isFav, size: 18 })),
            h("div", { key: "badges", className: "absolute top-3 right-3 flex gap-2" }, [
              h("span", { key: "st", className: "h-7 px-3 rounded-full text-[11px] font-bold grid place-items-center backdrop-blur-md border shadow-sm " + statusClass(p.status) }, p.status),
              h("span", { key: "id", className: "h-7 px-2.5 rounded-full bg-white/90 backdrop-blur border border-black/5 text-[11px] font-bold" }, "#" + String(p.id).padStart(2, "0"))
            ]),
            h("div", { key: "over", className: "absolute bottom-3 right-3 left-3 flex justify-between items-end" }, [
              h("div", { key: "price", className: "rounded-full bg-black text-white px-3.5 py-1.5 text-[13px] font-extrabold shadow" }, " " + formatPrice(p.price) + " "),
              h("div", { key: "fin", className: "rounded-full bg-white/90 backdrop-blur px-3 py-1.5 text-[11px] font-bold border border-black/5" }, "مفروش: " + p.finishing)
            ])
          ]),
          h("div", { key: "body", className: "p-4" }, [
            h("h3", { key: "t", className: "font-bold leading-[1.3] text-[15px] line-clamp-2" }, p.title),
            h("div", { key: "loc", className: "mt-1 flex items-center gap-1 text-[12px] text-black/50" }, [
              h("span", { key: "ic" }, "📍"),
              h("span", { key: "tx", className: "truncate" }, p.location)
            ]),
            h("div", { key: "stats", className: "mt-3 grid grid-cols-3 gap-2" }, [
              { k: p.area + " م²", v: "المساحة" },
              { k: p.rooms + " غرف", v: "الغرف" },
              { k: p.baths + " حمام", v: "الحمامات" }
            ].map(function (it) {
              return h("div", { key: it.v, className: "rounded-xl bg-[#f7f5f2] border border-black/[0.04] px-2 py-2 text-center" }, [
                h("div", { key: "k", className: "text-[12px] font-extrabold" }, it.k),
                h("div", { key: "v", className: "text-[10px] text-black/50" }, it.v)
              ]);
            })),
            h("p", { key: "d", className: "mt-3 text-[12.5px] leading-6 text-black/55 line-clamp-2" }, p.description),

            h("span", { key: "t" }, "حسابي")
          ])

      );

      /* ---------- المودال (تفاصيل العقار) ---------- */
      const modal = selected ? h("div", {
        className: "fixed inset-0 z-[80] bg-[#fbfaf8] overflow-y-auto",
        role: "dialog",
        "aria-modal": "true"
      }, [
        h("div", { key: "bar", className: "sticky top-0 z-10 backdrop-blur-xl bg-white/80 border-b border-black/5" }, [
          h("div", { key: "in", className: "mx-auto max-w-[1280px] px-4 md:px-6 h-[60px] flex items-center justify-between" }, [
            h("button", {
              key: "back",
              onClick: function () { setSelected(null); },
              className: "h-10 px-4 rounded-full bg-black text-white text-[13px] font-bold inline-flex items-center gap-2"
            }, "← رجوع للقائمة"),
            h("div", { key: "right", className: "flex items-center gap-2" }, [
              h("button", {
                key: "fav",
                onClick: function () { toggleFavorite(selected.id); },
                className: "h-9 px-3 rounded-full bg-white border border-black/10 hover:bg-black/5 transition inline-flex items-center gap-2 text-[12px] font-bold"
              }, [
                h(IconHeart, { key: "i", filled: favorites.has(String(selected.id)), size: 16 }),
                h("span", { key: "t" }, favorites.has(String(selected.id)) ? "محفوظ" : "حفظ")
              ]),
              h("span", { key: "st", className: "h-8 px-3 rounded-full text-[12px] font-bold grid place-items-center " + statusSolid(selected.status) }, selected.status),
              h("div", { key: "loc", className: "hidden md:block text-[12px] text-black/50" }, selected.location)
            ])
          ])
        ]),
        h("div", { key: "main", className: "mx-auto max-w-[1280px] px-4 md:px-6 py-6 grid lg:grid-cols-[1.6fr_0.9fr] gap-6" }, [
          h("div", { key: "left" }, [
            h("div", { key: "gallery", className: "rounded-[24px] overflow-hidden bg-white border border-black/5 shadow-sm" }, [
              h("div", { key: "hero", className: "relative aspect-[16/10] bg-[#efeeeb] overflow-hidden" }, [
                h("img", {
                  key: "i",
                  src: selected.images[imgIdx],
                  alt: selected.title,
                  className: "absolute inset-0 w-full h-full object-cover",
                  onError: handleImgError
                }),
                h("div", { key: "tag", className: "absolute bottom-3 left-3 flex gap-2" },
                  h("span", { className: "px-3 py-1.5 rounded-full bg-black/80 text-white text-[11px] font-bold backdrop-blur" },
                    "صورة " + (imgIdx + 1) + " / " + selected.images.length
                  )
                )
              ]),
              h("div", { key: "thumbs", className: "p-3 grid grid-cols-5 gap-2" },
                selected.images.map(function (src, i) {
                  return h("button", {
                    key: i,
                    onClick: function () { setImgIdx(i); },
                    className: "relative aspect-[4/3] rounded-xl overflow-hidden border-2 " + (imgIdx === i ? "border-black" : "border-transparent") + " hover:opacity-90 transition"
                  },
                    h("img", { src: src, alt: "", className: "absolute inset-0 w-full h-full object-cover", onError: handleImgError })
                  );
                })
              )
            ]),
            selected.video ? h("div", { key: "vid", className: "mt-5 rounded-[20px] bg-black text-white overflow-hidden border border-black/10" }, [
              h("div", { key: "h", className: "p-4 flex items-center justify-between" }, [
                h("div", { key: "t", className: "font-bold text-[14px]" }, "جولة فيديو للشقة"),
                h("div", { key: "s", className: "text-[11px] text-white/60" }, "YouTube • تجريبي")
              ]),
              h("div", { key: "v", className: "aspect-video bg-zinc-900" },
                h("iframe", { src: selected.video, title: "video", className: "w-full h-full", allowFullScreen: true })
              )
            ]) : null,
            h("div", { key: "desc", className: "mt-6 rounded-[22px] bg-white border border-black/5 p-5" }, [
              h("h3", { key: "h", className: "font-extrabold text-[16px]" }, "الوصف الكامل"),
              h("p", { key: "p", className: "mt-2 text-[14px] leading-7 text-black/70" }, selected.longDesc)
            ])
          ]),
          h("div", { key: "side", className: "lg:sticky lg:top-[76px] h-fit space-y-4" }, [
            h("div", { key: "card", className: "rounded-[22px] bg-white border border-black/5 p-5 shadow-[0_10px_30px_rgba(0,0,0,0.06)]" }, [
              h("div", { key: "lbl", className: "text-[12px] text-black/40 font-bold tracking-widest" }, "السعر"),
              h("div", { key: "price", className: "text-[30px] font-extrabold tracking-tight" }, formatPrice(selected.price)),
              h("h1", { key: "t", className: "mt-2 text-[18px] font-bold leading-[1.35]" }, selected.title),
              h("div", { key: "meta", className: "mt-1 text-[13px] text-black/50 flex items-center gap-1" },
                "📍 " + selected.location + " • الطابق " + selected.floor + " • بناء " + selected.year
              ),
              h("div", { key: "grid", className: "mt-4 grid grid-cols-2 gap-2" }, [
                ["المساحة", selected.area + " م²"],
                ["الغرف", String(selected.rooms)],
                ["الحمامات", String(selected.baths)],
                ["الطابق", String(selected.floor)],
                ["سنة البناء", String(selected.year)],
                ["التشطيب", selected.finishing],
                ["المصعد", selected.elevator ? "يوجد" : "لا يوجد"],
                ["موقف سيارات", selected.parking ? "يوجد" : "لا يوجد"],
                ["الحالة", selected.status],
                ["الموقع التفصيلي", selected.district]
              ].map(function (row) {
                return h("div", { key: row[0], className: "rounded-xl bg-[#f7f5f2] border border-black/[0.04] px-3 py-2.5 flex justify-between items-center" }, [
                  h("span", { key: "l", className: "text-[11px] text-black/50" }, row[0]),
                  h("span", { key: "v", className: "text-[12px] font-bold" }, row[1])
                ]);
              })),
              h("div", { key: "acts", className: "mt-4 grid grid-cols-3 gap-2" }, [
                h("a", {
                  key: "wa",
                  href: "https://wa.me/249900000000?text=" + encodeURIComponent("مرحبا، مهتم بالشقة #" + selected.id + " - " + selected.title),
                  target: "_blank",
                  rel: "noopener noreferrer",
                  className: "h-11 rounded-full bg-[#25D366] text-white font-bold text-[13px] grid place-items-center"
                }, "واتساب"),
                h("a", { key: "tel", href: "tel:+249900000000", className: "h-11 rounded-full bg-black text-white font-bold text-[13px] grid place-items-center" }, "اتصال"),
                h("button", {
                  key: "book",
                  onClick: function () { alert("تم طلب معاينة للشقة #" + selected.id + " — سنتواصل معك قريباً"); },
                  className: "h-11 rounded-full border border-black/10 bg-white font-bold text-[13px]"
                }, "حجز معاينة")
              ])
            ]),
            h("div", { key: "map", className: "rounded-[22px] bg-white border border-black/5 p-4" }, [
              h("div", { key: "h", className: "font-bold text-[13px]" }, "الموقع على الخريطة (تقريبي)"),
              h("div", { key: "mapBox", className: "mt-3 h-[180px] rounded-[16px] overflow-hidden relative bg-[#e9e6e1] border border-black/5" }, [
                h("div", { key: "bg", className: "absolute inset-0 opacity-60", style: { backgroundImage: "radial-gradient(#000 1px, transparent 1px)", backgroundSize: "18px 18px" } }),
                h("div", { key: "pin", className: "absolute inset-0 grid place-items-center" },
                  h("div", { className: "rounded-full bg-black text-white px-3 py-1.5 text-[11px] font-bold shadow-xl" }, "📍 " + selected.district)
                ),
                h("div", { key: "ft", className: "absolute bottom-2 left-2 right-2 flex justify-between text-[10px] text-black/40" }, [
                  h("span", { key: "a" }, "الخرطوم"),
                  h("span", { key: "b" }, "تحديد دقيق عند المعاينة")
                ])
              ])
            ]),
            h("div", { key: "similar", className: "rounded-[22px] bg-[#111] text-white p-4" }, [
              h("div", { key: "h", className: "text-[12px] text-white/50 font-bold" }, "شقق مشابهة"),
              h("div", { key: "list", className: "mt-3 grid gap-3" },
                APARTMENTS.filter(function (p) { return p.id !== selected.id && p.district === selected.district; }).slice(0, 3).map(function (p) {
                  return h("button", {
                    key: p.id,
                    onClick: function () { setSelected(p); },
                    className: "text-right flex gap-3 rounded-xl bg-white/5 border border-white/10 p-2 hover:bg-white/10 transition"
                  }, [
                    h("img", { key: "i", src: p.images[0], alt: "", className: "h-14 w-20 rounded-lg object-cover", onError: handleImgError }),
                    h("div", { key: "t", className: "leading-tight" }, [
                      h("div", { key: "a", className: "text-[12px] font-bold line-clamp-1" }, p.title),
                      h("div", { key: "b", className: "text-[11px] text-white/60" }, formatPrice(p.price) + " • " + p.rooms + " غرف")
                    ])
                  ]);
                })
              )
            ])
          ])
        ])
      ]) : null;

      /* ---------- مودال المصادقة ---------- */
      const authModal = authOpen ? h("div", {
        key: "am",
        className: "fixed inset-0 z-[80] bg-black/60 backdrop-blur-md grid place-items-center p-4",
        onClick: function (e) { if (e.target === e.currentTarget) setAuthOpen(false); }
      },
        h("div", { className: "bg-white rounded-[24px] p-6 w-full max-w-[400px] shadow-xl", onClick: function (e) { e.stopPropagation(); } }, [
          h("div", { key: "head", className: "flex items-center justify-between" }, [
            h("div", { key: "t", className: "text-[20px] font-extrabold" }, authMode === "login" ? "تسجيل الدخول" : "إنشاء حساب جديد"),
            h("button", { key: "c", onClick: function () { setAuthOpen(false); setAuthError(""); }, className: "h-8 w-8 rounded-full hover:bg-black/5 grid place-items-center text-[18px]" }, "×")
          ]),
          h("div", { key: "body", className: "mt-4 space-y-3" }, [
            authMode === "register" ? h("div", { key: "n" }, [
              h("label", { className: "text-[12px] font-bold text-black/60" }, "الاسم"),
              h("input", {
                type: "text",
                value: authForm.name,
                onChange: function (e) { setAuthForm(Object.assign({}, authForm, { name: e.target.value })); },
                placeholder: "اسمك الكامل",
                className: "mt-1 w-full h-11 px-3 rounded-xl bg-[#f6f5f3] border border-black/5 outline-none text-[13.5px] focus:bg-white focus:border-black/15 transition"
              })
            ]) : null,
            h("div", { key: "e" }, [
              h("label", { className: "text-[12px] font-bold text-black/60" }, "البريد الإلكتروني"),
              h("input", {
                type: "email",
                value: authForm.email,
                onChange: function (e) { setAuthForm(Object.assign({}, authForm, { email: e.target.value })); },
                placeholder: "you@example.com",
                className: "mt-1 w-full h-11 px-3 rounded-xl bg-[#f6f5f3] border border-black/5 outline-none text-[13.5px] focus:bg-white focus:border-black/15 transition",
                dir: "ltr"
              })
            ]),
            h("div", { key: "p" }, [
              h("label", { className: "text-[12px] font-bold text-black/60" }, "كلمة المرور"),
              h("input", {
                type: "password",
                value: authForm.password,
                onChange: function (e) { setAuthForm(Object.assign({}, authForm, { password: e.target.value })); },
                placeholder: "6 أحرف على الأقل",
                className: "mt-1 w-full h-11 px-3 rounded-xl bg-[#f6f5f3] border border-black/5 outline-none text-[13.5px] focus:bg-white focus:border-black/15 transition",
                dir: "ltr"
              })
            ]),
            authError ? h("div", { key: "err", className: "rounded-lg bg-red-50 border border-red-200 text-red-700 text-[12px] p-2.5" }, authError) : null
          ]),
          h("button", {
            key: "submit",
            onClick: submitAuth,
            disabled: authLoading,
            className: "mt-5 w-full h-11 rounded-full bg-black text-white font-bold text-[14px] disabled:opacity-60"
          }, authLoading ? "..." : (authMode === "login" ? "دخول" : "إنشاء الحساب")),
          h("div", { key: "switch", className: "mt-4 text-center text-[13px] text-black/60" }, [
            authMode === "login" ? "ليس لديك حساب؟ " : "لديك حساب بالفعل؟ ",
            h("button", {
              key: "b",
              onClick: function () { setAuthMode(authMode === "login" ? "register" : "login"); setAuthError(""); },
              className: "font-bold text-black underline"
            }, authMode === "login" ? "أنشئ حساب" : "سجّل دخول")
          ])
        ])
      ) : null;

      /* ---------- تحديد المحتوى حسب الواجهة ---------- */
      const bodyContent = view === "home"
        ? [hero, filterBar, cards]
        : view === "favorites"
          ? [favoritesPage]
          : [accountPage];

      return h("div", {
        className: "min-h-screen bg-[#fbfaf8] text-[#111] selection:bg-black selection:text-white page-root",
        style: { fontFamily: "'Cairo', 'Tajawal', system-ui, sans-serif" }
      }, [
        h("style", { key: "f", dangerouslySetInnerHTML: { __html:
          "@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&display=swap');" +
          "::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#ddd;border-radius:999px}" +
          "@media (max-width: 767px){ .page-root{ padding-bottom: 80px; } }"
        }}),
        header,
        ...bodyContent,
        footer,
        bottomNav,
        modal,
        authModal
      ]);
    }

    ReactDOM.createRoot(document.getElementById("root")).render(
      h(StrictMode, null, h(App, null))
    );
  })();
  </script>

  <script>
    (function () {
      function fix(a) {
        const href = a.getAttribute("href");
        if (!href) return;
        try {
          const u = new URL(href, document.baseURI);
          if ((u.protocol === "http:" || u.protocol === "https:") && u.host !== location.host) {
            a.target = "_blank";
            a.rel = "noopener noreferrer";
          }
        } catch (e) {}
      }
      function run() { document.querySelectorAll("a[href]").forEach(fix); }
      if (document.readyState !== "loading") run();
      else document.addEventListener("DOMContentLoaded", run);
      document.addEventListener("click", function (e) {
        const a = e.target && e.target.closest && e.target.closest("a[href]");
        if (a) fix(a);
      }, true);
    })();
  </script>
