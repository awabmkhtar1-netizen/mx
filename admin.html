<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لوحة تحكم المسؤول | مساكن</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800 p-4 md:p-8">

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-6">
    <h1 class="text-2xl font-bold mb-6 text-center" id="formTitle">لوحة إضافة العقارات</h1>

    <form id="addForm" class="space-y-4">
      <input type="hidden" id="propertyId" value="">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1">عنوان العقار</label>
          <input type="text" id="title" required class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">وصف قصير (مثال: 3 غرف في الرياض)</label>
          <input type="text" id="short" required class="w-full border rounded-lg p-2">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1">الموقع</label>
          <input type="text" id="location" required placeholder="الخرطوم - الرياض" class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الحي</label>
          <input type="text" id="district" required placeholder="الرياض" class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">السعر (جنيه)</label>
          <input type="number" id="price" required class="w-full border rounded-lg p-2">
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1">المساحة (م²)</label>
          <input type="number" id="area" required class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الغرف</label>
          <input type="number" id="rooms" required class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الحمامات</label>
          <input type="number" id="baths" required class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الطابق</label>
          <input type="number" id="floor" required class="w-full border rounded-lg p-2">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-sm font-bold mb-1">سنة البناء</label>
          <input type="number" id="year" required class="w-full border rounded-lg p-2">
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">الحالة</label>
          <select id="status" class="w-full border rounded-lg p-2">
            <option value="متاح">متاح</option>
            <option value="محجوز">محجوز</option>
            <option value="مباع">مباع</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-bold mb-1">التشطيب</label>
          <input type="text" id="finishing" required placeholder="سوبر لوكس" class="w-full border rounded-lg p-2">
        </div>
      </div>

      <div class="flex gap-6">
        <label class="flex items-center gap-2">
          <input type="checkbox" id="elevator" class="w-4 h-4" checked> يوجد مصعد
        </label>
        <label class="flex items-center gap-2">
          <input type="checkbox" id="parking" class="w-4 h-4" checked> يوجد موقف سيارات
        </label>
      </div>

      <!-- رقم الهاتف الجديد -->
      <div>
        <label class="block text-sm font-bold mb-1">رقم هاتف التواصل (اختياري)</label>
        <input type="text" id="contact_phone" placeholder="مثال: 0912345678" class="w-full border rounded-lg p-2 text-left" dir="ltr">
      </div>

      <div>
        <label class="block text-sm font-bold mb-1">الوصف (يظهر في الكارت)</label>
        <textarea id="description" required rows="2" class="w-full border rounded-lg p-2"></textarea>
      </div>
      <div>
        <label class="block text-sm font-bold mb-1">الوصف الكامل (يظهر في التفاصيل)</label>
        <textarea id="long_description" required rows="4" class="w-full border rounded-lg p-2"></textarea>
      </div>

      <div>
        <label class="block text-sm font-bold mb-1">روابط الصور (رابط واحد في كل سطر)</label>
        <textarea id="images" required rows="4" placeholder="https://example.com/img1.jpg&#10;https://example.com/img2.jpg" class="w-full border rounded-lg p-2 text-left" dir="ltr"></textarea>
      </div>

      <div>
        <label class="block text-sm font-bold mb-1">رابط الفيديو (اختياري - اتركه فارغاً إذا لم يوجد)</label>
        <input type="text" id="video" class="w-full border rounded-lg p-2 text-left" dir="ltr">
      </div>

      <div class="flex gap-2">
        <button type="submit" id="submitBtn" class="w-full bg-black text-white font-bold py-3 rounded-xl hover:bg-gray-800 transition">
          حفظ العقار ونشره
        </button>
        <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden w-1/3 bg-gray-300 text-black font-bold py-3 rounded-xl hover:bg-gray-400 transition">
          إلغاء التعديل
        </button>
      </div>
    </form>
    
    <div id="message" class="mt-4 text-center font-bold"></div>
  </div>

  <div class="max-w-2xl mx-auto bg-white rounded-2xl shadow-xl p-6 mt-8">
    <h2 class="text-xl font-bold mb-4">الشقق المضافة حالياً</h2>
    <div id="propertiesList" class="space-y-3">
      <p class="text-gray-500">جاري التحميل...</p>
    </div>
  </div>

  <script>
    // الحماية
    async function checkAdmin() {
      try {
        const res = await fetch('/api/auth/me');
        if (!res.ok) throw new Error('غير مسجل');
        const user = await res.json();
        if (user.role !== 'admin') {
          document.body.innerHTML = '<h1 style="text-align:center; margin-top:50px; color:red;">عذراً، هذه الصفحة مخصصة للمسؤول فقط.</h1>';
        }
      } catch (e) {
        window.location.href = '/';
      }
    }
    checkAdmin();

    // جلب الشقق
    async function loadProperties() {
      const listDiv = document.getElementById('propertiesList');
      try {
        const res = await fetch('/api/properties');
        const data = await res.json();
        
        if (data.length === 0) {
          listDiv.innerHTML = '<p class="text-gray-500">لا توجد شقق مضافة.</p>';
          return;
        }

        listDiv.innerHTML = data.map(p => `
          <div class="flex flex-col md:flex-row justify-between items-center border p-3 rounded-lg gap-2">
            <div class="text-right w-full">
              <p class="font-bold">${p.title}</p>
              <p class="text-sm text-gray-500">${p.price} جنيه | هاتف: ${p.contact_phone || 'غير محدد'}</p>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
              <button onclick='editProperty(${JSON.stringify(p)})' class="bg-blue-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-600 w-full md:w-auto">تعديل</button>
              <button onclick="deleteProperty('${p.id}')" class="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600 w-full md:w-auto">حذف</button>
            </div>
          </div>
        `).join('');
      } catch (e) {
        listDiv.innerHTML = '<p class="text-red-500">حدث خطأ في تحميل البيانات</p>';
      }
    }

    // مسح شقة
    async function deleteProperty(id) {
      if (!confirm('هل أنت متأكد من حذف هذه الشقة؟')) return;
      try {
        const res = await fetch('/api/admin-delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: id })
        });
        if (res.ok) {
          alert('تم حذف الشقة بنجاح');
          loadProperties();
        } else {
          const err = await res.json();
          alert('خطأ: ' + err.error);
        }
      } catch (e) {
        alert('حدث خطأ في الاتصال');
      }
    }

    // تعديل شقة
    function editProperty(p) {
      document.getElementById('propertyId').value = p.id;
      document.getElementById('title').value = p.title;
      document.getElementById('short').value = p.short;
      document.getElementById('location').value = p.location;
      document.getElementById('district').value = p.district;
      document.getElementById('price').value = p.price;
      document.getElementById('area').value = p.area;
      document.getElementById('rooms').value = p.rooms;
      document.getElementById('baths').value = p.baths;
      document.getElementById('floor').value = p.floor;
      document.getElementById('year').value = p.year;
      document.getElementById('status').value = p.status;
      document.getElementById('finishing').value = p.finishing;
      document.getElementById('elevator').checked = p.elevator === 1;
      document.getElementById('parking').checked = p.parking === 1;
      document.getElementById('contact_phone').value = p.contact_phone || '';
      document.getElementById('description').value = p.description;
      document.getElementById('long_description').value = p.long_description;
      document.getElementById('video').value = p.video || '';
      
      // تحويل مصفوفة الصور إلى نص
      const imgs = p.images ? JSON.parse(p.images) : [];
      document.getElementById('images').value = imgs.join('\n');

      document.getElementById('formTitle').innerText = 'تعديل العقار';
      document.getElementById('submitBtn').innerText = 'حفظ التعديلات';
      document.getElementById('cancelBtn').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    function resetForm() {
      document.getElementById('addForm').reset();
      document.getElementById('propertyId').value = '';
      document.getElementById('formTitle').innerText = 'لوحة إضافة العقارات';
      document.getElementById('submitBtn').innerText = 'حفظ العقار ونشره';
      document.getElementById('cancelBtn').classList.add('hidden');
    }

    // إرسال الفورم (إضافة أو تعديل)
    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      const propId = document.getElementById('propertyId').value;
      const isEdit = propId !== '';

      btn.innerText = 'جاري الحفظ...';
      btn.disabled = true;
      msg.innerText = '';

      const imagesText = document.getElementById('images').value.trim();
      const imagesArray = imagesText.split('\n').map(url => url.trim()).filter(url => url !== '');
      
      const data = {
        id: propId,
        title: document.getElementById('title').value,
        short: document.getElementById('short').value,
        location: document.getElementById('location').value,
        district: document.getElementById('district').value,
        price: parseInt(document.getElementById('price').value),
        area: parseInt(document.getElementById('area').value),
        rooms: parseInt(document.getElementById('rooms').value),
        baths: parseInt(document.getElementById('baths').value),
        floor: parseInt(document.getElementById('floor').value),
        year: parseInt(document.getElementById('year').value),
        status: document.getElementById('status').value,
        finishing: document.getElementById('finishing').value,
        elevator: document.getElementById('elevator').checked ? 1 : 0,
        parking: document.getElementById('parking').checked ? 1 : 0,
        contact_phone: document.getElementById('contact_phone').value,
        description: document.getElementById('description').value,
        long_description: document.getElementById('long_description').value,
        images: JSON.stringify(imagesArray),
        video: document.getElementById('video').value
      };

      const url = isEdit ? '/api/admin-edit' : '/api/admin-add';

      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await res.json();

        if (res.ok) {
          msg.className = 'mt-4 text-center font-bold text-green-600';
          msg.innerText = isEdit ? 'تم حفظ التعديلات بنجاح!' : 'تم حفظ العقار بنجاح!';
          resetForm();
          loadProperties();
        } else {
          throw new Error(result.error || 'حدث خطأ');
        }
      } catch (error) {
        msg.className = 'mt-4 text-center font-bold text-red-600';
        msg.innerText = 'خطأ: ' + error.message;
      } finally {
        btn.innerText = isEdit ? 'حفظ التعديلات' : 'حفظ العقار ونشره';
        btn.disabled = false;
      }
    });

    loadProperties();
  </script>
</body>
</html>
